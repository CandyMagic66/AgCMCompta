<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Candy Magic — Assistant Comptable</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --pink: #FF6B9D;
      --purple: #A78BFA;
      --cyan: #60CDFF;
      --bg: #0c0c18;
      --bg2: #18102a;
      --surface: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.08);
      --text: #ffffff;
      --muted: #888;
    }

    html, body {
      height: 100%;
      font-family: 'Outfit', sans-serif;
      background: linear-gradient(135deg, var(--bg) 0%, var(--bg2) 50%, #0c1818 100%);
      color: var(--text);
      overflow: hidden;
    }

    /* ── Layout ── */
    #app {
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 12px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* ── Header ── */
    header {
      text-align: center;
      padding-bottom: 4px;
      flex-shrink: 0;
    }
    .eyebrow {
      font-size: 10px;
      letter-spacing: 4px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    header h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -1.5px;
      line-height: 1;
    }
    .candy { color: var(--pink); }
    .magic {
      background: linear-gradient(90deg, var(--purple), var(--cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .chips {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 8px;
      flex-wrap: wrap;
    }
    .chip {
      border-radius: 16px;
      padding: 3px 10px;
      font-size: 10px;
    }
    .chip.commission {
      background: rgba(167,139,250,0.1);
      border: 1px solid rgba(167,139,250,0.25);
      color: var(--purple);
    }
    .chip.loyer {
      background: var(--surface);
      border: 1px solid var(--border);
      color: #555;
    }

    /* ── Main layout ── */
    .main {
      display: flex;
      gap: 12px;
      flex: 1;
      min-height: 0;
    }

    /* ── Chat panel ── */
    .chat-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 0;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg {
      display: flex;
    }
    .msg.user { justify-content: flex-end; }
    .msg.assistant { justify-content: flex-start; }

    .bubble {
      max-width: 82%;
      padding: 10px 14px;
      font-size: 13px;
      line-height: 1.65;
    }
    .msg.user .bubble {
      background: linear-gradient(135deg, var(--pink), var(--purple));
      border-radius: 16px 16px 4px 16px;
    }
    .msg.assistant .bubble {
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      border-radius: 16px 16px 16px 4px;
    }
    .bubble strong { font-weight: 700; }

    /* Typing dots */
    .typing { display: flex; gap: 5px; padding: 6px 14px; }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--purple);
      animation: bounce 1.4s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: .16s; }
    .dot:nth-child(3) { animation-delay: .32s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40%  { transform: scale(1); }
    }

    /* ── Suggestions ── */
    .suggestions {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    .sugg-btn {
      background: rgba(167,139,250,0.08);
      border: 1px solid rgba(167,139,250,0.22);
      border-radius: 18px;
      padding: 5px 13px;
      font-size: 11px;
      color: var(--purple);
      cursor: pointer;
      font-family: inherit;
      transition: background .2s;
    }
    .sugg-btn:hover { background: rgba(167,139,250,0.18); }

    /* ── Input row ── */
    .input-row {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }
    textarea {
      flex: 1;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 13px;
      resize: none;
      outline: none;
      font-family: inherit;
      transition: border-color .2s;
    }
    textarea:focus { border-color: rgba(167,139,250,0.4); }
    textarea::placeholder { color: #555; }

    #send-btn {
      background: linear-gradient(135deg, var(--pink), var(--purple));
      border: none;
      border-radius: 12px;
      padding: 0 20px;
      color: white;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .2s;
    }
    #send-btn:disabled { opacity: .4; cursor: not-allowed; }

    /* ── Preview panel ── */
    .preview-panel {
      width: 400px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .preview-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .preview-header .label {
      font-size: 9px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .preview-header .note-num {
      font-size: 12px;
      font-weight: 700;
    }
    .preview-actions { display: flex; gap: 7px; }
    .btn-print {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 7px;
      padding: 5px 12px;
      color: white;
      font-size: 11px;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-close {
      background: rgba(255,107,157,0.1);
      border: 1px solid rgba(255,107,157,0.25);
      border-radius: 7px;
      padding: 5px 10px;
      color: var(--pink);
      font-size: 11px;
      cursor: pointer;
    }
    .iframe-wrap {
      background: white;
      border-radius: 8px;
      overflow: hidden;
      flex: 1;
    }
    .iframe-wrap iframe {
      border: none;
      width: 167%;
      height: 680px;
      transform: scale(0.6);
      transform-origin: top left;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 3px; }

    /* ── Responsive mobile ── */
    @media (max-width: 700px) {
      .preview-panel { display: none; }
      header h1 { font-size: 22px; }
    }
  </style>
</head>
<body>
<div id="app">

  <header>
    <div class="eyebrow">Assistant Comptable</div>
    <h1><span class="candy">Candy</span> <span class="magic">Magic</span></h1>
    <div class="chips" id="chips"></div>
  </header>

  <div class="main">

    <div class="chat-panel">
      <div class="messages" id="messages"></div>

      <div class="suggestions" id="suggestions"></div>

      <div class="input-row">
        <textarea id="input" rows="2"
          placeholder="Ex : Note de débit TDLP mai 2026…"></textarea>
        <button id="send-btn">→</button>
      </div>
    </div>

    <div class="preview-panel" id="preview-panel" style="display:none">
      <div class="preview-header">
        <div>
          <div class="label">Aperçu</div>
          <div class="note-num" id="preview-title"></div>
        </div>
        <div class="preview-actions">
          <button class="btn-print" onclick="printNote()">🖨 Imprimer / PDF</button>
          <button class="btn-close" onclick="closePreview()">✕</button>
        </div>
      </div>
      <div class="iframe-wrap">
        <iframe id="preview-iframe" title="Note de débit"></iframe>
      </div>
    </div>

  </div>
</div>

<script>
// ─── CONFIG ──────────────────────────────────────────────────────────────────
// 👇 Remplace par l'URL de ton proxy Vercel après déploiement
const PROXY_URL = "https://ag-cm-compta.vercel.app/api/chat";

const EMETTEUR = {
  nom: "SASU 10RUPT",
  adresse: "10 rue Ingmar Bergman",
  cp_ville: "66000 PERPIGNAN",
  siret: "93763469900014",
  tva: "FR42937634699",
  tel: "06.62.27.87.03",
};

const MOIS_FR = ["Janvier","Février","Mars","Avril","Mai","Juin",
                 "Juillet","Août","Septembre","Octobre","Novembre","Décembre"];

// ─── PARTENAIRES (mis à jour depuis ton Drive) ────────────────────────────────
const PARTENAIRES = [
  { nom:"Tabac de La Place",  adresse:"4 avenue de la méditerranée", cp:"66140", ville:"Canet-en-Roussillon", siret:"99122953500018", code:"TDLP", type:"Commission", commission:2.00 },
  { nom:"Carrefour Claira",   adresse:"Route du Barcares",           cp:"66530", ville:"Claira",              siret:"",              code:"CCLA", type:"Loyer Fixe",  loyer:470 },
  { nom:"Youfun Pollestres",  adresse:"23 Rue Carpe Diem",           cp:"66450", ville:"Pollestres",          siret:"83793190600023", code:"YFPL", type:"Commission", commission:1.50 },
  { nom:"Gang de Pirates",    adresse:"6 rue Georges Mélies",        cp:"66600", ville:"Rivesaltes",          siret:"98395795200010", code:"GDPR", type:"Commission", commission:1.50 },
  { nom:"Camping Ma Prairie", adresse:"1 Avenue des coteaux",        cp:"66140", ville:"Canet-en-Roussillon", siret:"32357515900013", code:"CAMP", type:"Commission", commission:1.50 },
];

// ─── VENTES (mise à jour manuelle ou via Drive) ───────────────────────────────
// Format : CODE -> { mois_index(0=jan) -> unites }
const VENTES = {
  TDLP: { 0:30, 1:35, 2:6,   3:36 },
  YFPL: { 0:0,  1:42, 2:125, 3:149 },
  GDPR: {},
  CAMP: {},
};

// ─── UTILS ───────────────────────────────────────────────────────────────────
const pad  = n => String(n).padStart(2,"0");
const fmtD = d => `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`;
const fmtE = n => n.toFixed(2).replace(".",",")+" €";

// ─── SYSTEM PROMPT ────────────────────────────────────────────────────────────
function buildSystem() {
  const pLines = PARTENAIRES.map(p =>
    p.type === "Commission"
      ? `• ${p.code} | ${p.nom} | ${p.adresse}, ${p.cp} ${p.ville} | SIRET: ${p.siret||"-"} | Commission: ${p.commission} €HT/unité`
      : `• ${p.code} | ${p.nom} | LOYER FIXE ${p.loyer}€TTC/mois → pas de note à générer`
  ).join("\n");

  const vLines = Object.entries(VENTES).map(([code, moisData]) => {
    const parts = Object.entries(moisData).map(([m,u]) => `${MOIS_FR[+m]}: ${u}u`).join(" | ");
    return `  ${code}: ${parts || "(pas encore de données)"}`;
  }).join("\n");

  return `Tu es l'assistant comptable de Candy Magic (SASU 10RUPT, Perpignan).
Tu génères des notes de débit pour les partenaires en partage de recettes.

PARTENAIRES :
${pLines}

VENTES 2026 PAR MACHINE :
${vLines}

RÈGLES :
- "Loyer Fixe" : le partenaire facture Candy Magic → rien à générer
- "Commission" : générer une note de débit
- Total HT = Unités vendues × Commission HT/unité

POUR GÉNÉRER UNE NOTE, réponds UNIQUEMENT avec ce JSON (rien avant, rien après) :
{
  "action": "generate_note",
  "client_code": "CODE",
  "mois": 4,
  "annee": 2026,
  "unites": 149,
  "deja_verse": 0
}

Pour toute autre question, réponds en français, concis et professionnel.
Aujourd'hui : ${new Date().toLocaleDateString("fr-FR")}.`;
}

// ─── GÉNÉRATION HTML NOTE DE DÉBIT ───────────────────────────────────────────
function genererNoteHTML(client, mois, annee, unites, dejaVerse) {
  const dateDebut = new Date(annee, mois-1, 1);
  const dateFin   = new Date(annee, mois, 0);
  const totalHT   = unites * client.commission;
  const aRegler   = Math.max(0, totalHT - dejaVerse);
  const numero    = `${annee}${pad(mois)}${client.code}`;

  return `<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"/>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:#f5f5f0;display:flex;justify-content:center;padding:40px 20px}
.doc{background:white;width:794px;min-height:1000px;padding:56px 64px}
.header{display:flex;justify-content:space-between;margin-bottom:44px}
.logo h1{font-size:26px;font-weight:800;letter-spacing:-1px}
.c{color:#FF6B9D}.m{color:#A78BFA}
.logo p{font-size:10px;letter-spacing:2px;color:#aaa;text-transform:uppercase;margin-top:3px}
.emit{text-align:right;font-size:12px;color:#666;line-height:1.8}
.emit strong{display:block;font-size:13px;color:#1a1a1a;font-weight:700}
.tag{display:inline-block;background:linear-gradient(135deg,#FF6B9D,#A78BFA);color:white;font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:5px 14px;border-radius:20px;margin-bottom:20px}
.titre{font-size:30px;font-weight:800;color:#1a1a1a;letter-spacing:-1.5px}
.num{font-size:13px;color:#A78BFA;font-weight:600;margin:4px 0 36px}
.parties{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:32px}
.partie{background:#fafafa;border:1px solid #eee;border-radius:10px;padding:18px 22px}
.lbl{font-size:9px;text-transform:uppercase;letter-spacing:1.5px;color:#bbb;margin-bottom:8px;font-weight:600}
.pnom{font-size:14px;font-weight:700;color:#1a1a1a;margin-bottom:4px}
.det{font-size:11px;color:#777;line-height:1.9}
.periode{background:linear-gradient(135deg,#FFF5F9,#F5F0FF);border-radius:10px;padding:14px 22px;margin-bottom:32px;display:flex;gap:36px;align-items:center}
.pi span{display:block;font-size:9px;text-transform:uppercase;letter-spacing:1px;color:#bbb;margin-bottom:1px}
.pi strong{font-size:14px;font-weight:700;color:#1a1a1a}
table{width:100%;border-collapse:collapse;margin-bottom:24px}
thead{background:#1a1a1a;color:white}
thead th{padding:12px 14px;font-size:11px;text-align:left;letter-spacing:.5px;font-weight:600}

tbody td{padding:12px 14px;font-size:13px;color:#333}
tbody td:last-child{text-align:right;font-weight:600}
.totaux{display:flex;justify-content:flex-end;margin-bottom:32px}
.tbox{width:280px}
.trow{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #f5f5f5;font-size:13px;color:#666}
.tbig{background:linear-gradient(135deg,#FF6B9D,#A78BFA);color:white;padding:13px 14px;border-radius:9px;font-size:15px;font-weight:700;display:flex;justify-content:space-between;margin-top:6px}
.mention{background:#fafafa;border-left:3px solid #A78BFA;border-radius:0 8px 8px 0;padding:14px 18px;font-size:10.5px;color:#777;line-height:2;margin-bottom:24px}
.footer{text-align:center;font-size:10px;color:#ccc;border-top:1px solid #eee;padding-top:16px}
</style></head><body><div class="doc">
<div class="header">
  <div class="logo"><h1><span class="c">Candy</span> <span class="m">Magic</span></h1><p>Barbe à Papa Automatique</p></div>
  <div class="emit"><strong>${EMETTEUR.nom}</strong>${EMETTEUR.adresse}<br/>${EMETTEUR.cp_ville}<br/>SIRET\u00a0: ${EMETTEUR.siret}<br/>TVA\u00a0: ${EMETTEUR.tva}<br/>${EMETTEUR.tel}</div>
</div>
<div class="tag">Note de Débit</div>
<div class="titre">N°\u00a0${numero}</div>
<div class="num">Émise le ${fmtD(new Date())} — ${MOIS_FR[mois-1]} ${annee}</div>
<div class="parties">
  <div class="partie"><div class="lbl">Émetteur</div><div class="pnom">${EMETTEUR.nom}</div><div class="det">${EMETTEUR.adresse}<br/>${EMETTEUR.cp_ville}<br/>SIRET\u00a0: ${EMETTEUR.siret}<br/>TVA\u00a0: ${EMETTEUR.tva}</div></div>
  <div class="partie"><div class="lbl">Destinataire</div><div class="pnom">${client.nom}</div><div class="det">${client.adresse}<br/>${client.cp} ${client.ville}${client.siret?`<br/>SIRET\u00a0: ${client.siret}`:""}</div></div>
</div>
<div class="periode">
  <div class="pi"><span>Du</span><strong>${fmtD(dateDebut)}</strong></div>
  <div class="pi"><span>Au</span><strong>${fmtD(dateFin)}</strong></div>
  <div class="pi"><span>Mois</span><strong>${MOIS_FR[mois-1]} ${annee}</strong></div>
</div>
<table>
  <thead><tr><th>Désignation</th><th style="text-align:right">Unités</th><th style="text-align:right">Redevance HT/unité</th><th>Montant HT</th></tr></thead>
  <tbody><tr><td>Barbe à Papa</td><td style="text-align:right">${unites}</td><td style="text-align:right">${fmtE(client.commission)}</td><td>${fmtE(totalHT)}</td></tr></tbody>
</table>
<div class="totaux"><div class="tbox">
  <div class="trow"><span>Total HT</span><strong>${fmtE(totalHT)}</strong></div>
  ${dejaVerse>0?`<div class="trow"><span>Déjà versé</span><strong>- ${fmtE(dejaVerse)}</strong></div>`:""}
  <div class="tbig"><span>Total à régler</span><strong>${fmtE(aRegler)}</strong></div>
</div></div>
<div class="mention">Note de débit établie selon contrat signé entre les parties pour un partage de chiffre d'affaires HT.<br/>Montant calculé sur la base du chiffre d'affaires <strong>hors taxes</strong>.<br/><strong>Aucune TVA applicable sur la présente note de débit.</strong><br/>La TVA afférente aux ventes est intégralement déclarée et reversée par l'exploitant du distributeur.</div>
<div class="footer">${EMETTEUR.nom} — SIRET ${EMETTEUR.siret} — ${EMETTEUR.adresse}, ${EMETTEUR.cp_ville}</div>
</div></body></html>`;
}

// ─── STATE ────────────────────────────────────────────────────────────────────
let history   = [];
let loading   = false;
let currentHTML = null;

// ─── UI HELPERS ──────────────────────────────────────────────────────────────
function addMessage(role, text) {
  const div = document.createElement("div");
  div.className = `msg ${role}`;
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.innerHTML = text
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/\n/g, "<br/>");
  div.appendChild(bubble);
  document.getElementById("messages").appendChild(div);
  div.scrollIntoView({behavior:"smooth", block:"end"});
  return div;
}

function showTyping() {
  const div = document.createElement("div");
  div.className = "msg assistant";
  div.id = "typing";
  div.innerHTML = `<div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
  document.getElementById("messages").appendChild(div);
  div.scrollIntoView({behavior:"smooth", block:"end"});
}

function hideTyping() {
  const t = document.getElementById("typing");
  if (t) t.remove();
}

function printNote() {
  if (!currentHTML) return;
  const w = window.open("","_blank");
  w.document.write(currentHTML);
  w.document.close();
  w.print();
}

function closePreview() {
  document.getElementById("preview-panel").style.display = "none";
  currentHTML = null;
}

function showPreview(html, title) {
  currentHTML = html;
  document.getElementById("preview-iframe").srcdoc = html;
  document.getElementById("preview-title").textContent = title;
  document.getElementById("preview-panel").style.display = "flex";
}

// ─── SEND MESSAGE ─────────────────────────────────────────────────────────────
async function sendMessage(text) {
  if (!text.trim() || loading) return;
  loading = true;
  document.getElementById("send-btn").disabled = true;
  document.getElementById("input").value = "";

  addMessage("user", text);
  history.push({ role: "user", content: text });
  showTyping();

  try {
    const res = await fetch(PROXY_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 1000,
        system: buildSystem(),
        messages: history,
      }),
    });

    const data = await res.json();
    const raw = (data.content || []).filter(b => b.type === "text").map(b => b.text).join("");
    hideTyping();

    // Détection JSON note de débit
    const jsonMatch = raw.match(/\{[\s\S]*?"action"\s*:\s*"generate_note"[\s\S]*?\}/);
    let assistantText = raw;

    if (jsonMatch) {
      try {
        const p = JSON.parse(jsonMatch[0]);
        const client = PARTENAIRES.find(x => x.code === p.client_code);
        if (client) {
          const html = genererNoteHTML(client, p.mois, p.annee, p.unites, p.deja_verse || 0);
          const totalHT = p.unites * client.commission;
          const aRegler = Math.max(0, totalHT - (p.deja_verse || 0));
          const num = `${p.annee}${pad(p.mois)}${p.client_code}`;
          assistantText = `✅ **Note N° ${num}** générée\n\n**${client.nom}** — ${MOIS_FR[p.mois-1]} ${p.annee}\n${p.unites} unités × ${fmtE(client.commission)} = **${fmtE(totalHT)}**\n**→ À régler : ${fmtE(aRegler)}**`;
          showPreview(html, `N° ${num} — ${client.nom}`);
        }
      } catch(_) {}
    }

    addMessage("assistant", assistantText);
    history.push({ role: "assistant", content: assistantText });

  } catch(e) {
    hideTyping();
    addMessage("assistant", `❌ Erreur de connexion : ${e.message}\n\nVérifie que l'URL du proxy Vercel est bien configurée dans index.html`);
  }

  loading = false;
  document.getElementById("send-btn").disabled = false;
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
document.addEventListener("DOMContentLoaded", () => {

  // Chips partenaires
  const chipsEl = document.getElementById("chips");
  PARTENAIRES.forEach(p => {
    const span = document.createElement("span");
    span.className = `chip ${p.type === "Commission" ? "commission" : "loyer"}`;
    span.textContent = p.type === "Commission"
      ? `${p.code} · ${p.commission}€/u`
      : `${p.code} · loyer fixe`;
    chipsEl.appendChild(span);
  });

  // Suggestions
  const SUGG = [
    "Note TDLP ce mois-ci",
    "Note YouFun ce mois-ci",
    "Génère toutes les notes du mois",
    "CA total 2026 par partenaire",
  ];
  const suggEl = document.getElementById("suggestions");
  SUGG.forEach(s => {
    const btn = document.createElement("button");
    btn.className = "sugg-btn";
    btn.textContent = s;
    btn.onclick = () => sendMessage(s);
    suggEl.appendChild(btn);
  });

  // Message de bienvenue
  const now = new Date();
  const moisPrecedent = MOIS_FR[now.getMonth() === 0 ? 11 : now.getMonth() - 1];
  addMessage("assistant",
    `Bonjour Rémi 👋\n\nPrêt à travailler. Nous sommes le ${now.toLocaleDateString("fr-FR")} — si tu veux générer les notes de **${moisPrecedent}**, dis-le moi !\n\n**Partenaires en commission actifs :**\n${PARTENAIRES.filter(p=>p.type==="Commission").map(p=>`• **${p.code}** — ${p.nom} · ${p.commission}€ HT/unité`).join("\n")}`
  );
  history.push({ role: "assistant", content: `Bonjour Rémi ! Prêt pour les notes de ${moisPrecedent}.` });

  // Events
  document.getElementById("send-btn").onclick = () => {
    sendMessage(document.getElementById("input").value);
  };
  document.getElementById("input").addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(e.target.value); }
  });
});
</script>
